name: Database migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, deploy, reconcile history, or rebuild the disposable application database
        type: choice
        options: [inspect, deploy, record-applied, rebuild]
        default: inspect
      applied_versions:
        description: For record-applied only — exact verified migration timestamps, separated by commas or spaces
        type: string
        default: ''
      confirmation:
        description: For rebuild type REBUILD APPLICATION DATABASE; for record-applied type I VERIFIED THESE MIGRATIONS ARE ALREADY APPLIED
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Test migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test game rules and migration tooling
        run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start an isolated Supabase database
        run: supabase db start
      - name: Apply the complete migration chain on real PostgreSQL
        run: supabase db reset --local --no-seed
      - name: Stop the test database
        if: always()
        run: supabase stop --no-backup

  production:
    name: Supabase production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OPERATION: ${{ github.event_name == 'push' && (vars.SUPABASE_AUTO_DEPLOY == 'true' && 'deploy' || 'inspect') || inputs.operation }}
      APPLIED_VERSIONS: ${{ inputs.applied_versions }}
      REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check required GitHub secrets
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Add SUPABASE_ACCESS_TOKEN in GitHub Actions secrets}"
          : "${SUPABASE_DB_PASSWORD:?Add SUPABASE_DB_PASSWORD in GitHub Actions secrets}"
          : "${SUPABASE_PROJECT_ID:?Add SUPABASE_PROJECT_ID in GitHub Actions secrets}"
      - name: Link the production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show local and remote migration history
        run: supabase migration list --linked
      - name: Rebuild the disposable application database and apply all migrations
        if: env.OPERATION == 'rebuild'
        run: node scripts/rebuild-database.cjs
      - name: Record explicitly verified SQL Editor migrations
        if: env.OPERATION == 'record-applied'
        run: node scripts/record-applied-migrations.cjs
      - name: Adopt the consolidated baseline without changing application data
        if: env.OPERATION == 'deploy'
        run: node scripts/adopt-migration-baseline.cjs
      - name: Preview pending migrations
        if: env.OPERATION == 'deploy' || env.OPERATION == 'record-applied'
        run: supabase db push --linked --dry-run
      - name: Apply pending migrations in order
        if: env.OPERATION == 'deploy'
        run: supabase db push --linked --yes
      - name: Show resulting migration history
        run: supabase migration list --linked
